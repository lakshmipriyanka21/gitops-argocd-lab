apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-node-app
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gitops-node-app
  template:
    metadata:
      labels:
        app: gitops-node-app
    spec:
      containers:
        - name: node-app
          image: lakshmipriya1234/gitops-node-app:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
